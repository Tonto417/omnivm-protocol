[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"

solc = "/data/data/com.termux/files/usr/bin/solc"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./package.json" }
]

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@layerzerolabs/lz-evm-oapp-v2/=node_modules/@layerzerolabs/lz-evm-oapp-v2/",
  "@layerzerolabs/lz-evm-protocol-v2/=node_modules/@layerzerolabs/lz-evm-protocol-v2/",
  "@layerzerolabs/test-devtools-evm-foundry/=lib/devtools/packages/test-devtools-evm-foundry/",
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
mainnet = "${NEXT_PUBLIC_ETH_RPC_URL}"
arbitrum = "${NEXT_PUBLIC_ARBITRUM_RPC_URL}"
optimism = "${NEXT_PUBLIC_OPTIMISM_RPC_URL}"
base = "${NEXT_PUBLIC_BASE_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
